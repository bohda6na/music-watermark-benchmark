# Experiment settings for the audiowmark run on FMA-small.
# Every value below is copied from notebooks/01_audiowmark_baseline.ipynb
# (sections 2, 3, 6, 8, 10). If you change the notebook, change this file too.
# There is no random seed: our code has no random components. The test
# subset is chosen by a deterministic rule (see data.selection).

data:
  dataset: FMA-small               # 8,000 tracks * 30 s, 8 genres, 1,000 per genre
  source_url: https://github.com/mdeff/fma
  selection: first_n_per_genre_sorted_by_track_id
  tracks_per_genre: 10             # first 10 track ids of each genre
  n_genres: 8
  n_tracks: 80                     # 8 genres * 10 tracks
  selection_file: selected_80.csv  # columns: track_id, genre
  archive_sha1: ade154f733639d52e35e32f5593efe5be76c6d70   # fma_small.zip
  raw_dir: data/raw                # gitignored, audio is NOT committed

audio:
  channels: 1                      # mono
  sample_rate: 44100               # Hz
  format: wav                      # converted from the original FMA mp3 files

watermark:
  method: audiowmark               # classical spread-spectrum, GPL, run as an external CLI
  mode: short                      # audiowmark "--short 16" (16-bit message)
  bits: 16
  message_hex: a5c3                # same message for every track
  strength: 10                     # audiowmark default, not changed

detection:
  rule: bit_accuracy_threshold     # detected = bit accuracy >= threshold
  threshold: 0.875                 # 14/16; chance of a random match is about 0.2%
  not_found_is_undetected: true    # if audiowmark prints nothing: detected=False, bit_acc is empty

metrics:
  snr_db: "10 * log10( sum(x^2) / sum((x - x_w)^2) )"   # x = original, x_w = watermarked, no attack

# Attack parameters. They must be identical for every method in the team benchmark.
attacks:
  none: [null]                     # baseline, no attack
  speed: [0.9, 0.95, 1.05, 1.1]    # resampling, changes tempo AND pitch
  time_stretch: [0.9, 0.95, 1.05, 1.1]   # changes tempo, keeps pitch (librosa)
  pitch: [-2, -1, 1, 2]            # semitones (librosa)
  gain: [-6, 6]                    # dB, samples clipped to [-1, 1]
  crop: [0.5]                      # keep the first 50% of the track
# 1 + 4 + 4 + 4 + 2 + 1 = 16 variants per track -> 80 x 16 = 1280 rows

# Compression attacks (attacks/compression.py). Encode with ffmpeg, decode back to
# mono 44.1 kHz; output has the same length as the input (checked: no time shift).
compression_attacks:
  mp3: [128, 64, 32]               # kbps, constant bitrate, LAME (libmp3lame)
  aac: [128, 64, 32]               # kbps, AAC-LC, ffmpeg native encoder, .m4a
  encodec: [24, 12, 6, 3, 1.5]     # kbps, optional neural codec (EnCodec 24 kHz), --neural
# 3 + 3 = 6 variants per track (+5 with --neural)

# Extra experiment (notebook section 10): audiowmark --detect-speed
extra_experiment:
  method_label: audiowmark+detect-speed
  attack: speed
  params: [0.9, 1.1]               # only these two values, the option is slower
  # 80 tracks x 2 values = 160 rows

outputs:
  main_csv: results/results_audiowmark.csv                       # 1280 rows
  detect_speed_csv: results/results_audiowmark_detect_speed.csv  # 160 rows
  csv_columns: [method, attack, params, genre, track_id, detected, snr, bit_acc]